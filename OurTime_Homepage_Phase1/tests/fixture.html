<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isolated contract fixture — not the OurTime application</title>
<style>
/* Deliberately awkward legacy defaults exercise CSS scope and hidden states. */
body{margin:0;padding:24px;background:#f6f7f2;font-family:sans-serif}main{max-width:1400px;margin:auto;min-width:0}
button{background:orange;border-radius:40px;padding:20px;font-size:18px}dialog{display:grid;padding:20px;border-radius:40px}
h1{font-size:30px;font-weight:500}#sentinel{height:42px;background:#eee;margin-top:24px}#test-note{font-size:12px;color:#888}
</style>
<link rel="stylesheet" href="../files/web/home-query-ui.css"></head><body>
<main><p id="test-note">ISOLATED TEST FIXTURE. Synthetic adapter data. Not connected to any photo library.</p>
<h1>全部照片</h1><div id="home-host"></div><div id="sentinel">Unchanged gallery / caption sentinel (42 px).</div></main>
<script src="../files/web/home-query-ui.js"></script>
<script src="../files/web/home-query-bridge.js"></script>
<script>
'use strict';
window.fixture={
 state:{active:true,scopeKey:'timeline',query:{q:'',person:'',directory:''},sort:'date_desc',selecting:false,selectedCount:0,selectionKind:'exclude',personLabel:'',refreshAvailable:false},
 calls:[],people:[{id:'11',label:'测试人物甲'},{id:'12',label:'测试人物乙'},{id:'13',label:'测试人物丙'}],
 delay:0,peopleDelay:0,folderDelay:0,folderResult:null,failQuery:false,failPeople:false
};
const f=window.fixture;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const record=(name,payload)=>{f.calls.push({name,payload});};
window.fixtureAdapter={
 readState:()=>({...f.state,query:{...f.state.query},personLabel:f.state.personLabel||f.people.find(p=>p.id===f.state.query.person)?.label||''}),
 async applyQuery(query,context){
  record('applyQuery',{query,expectedScopeKey:context.expectedScopeKey,expectedQuery:context.expectedQuery});
  await wait(f.delay);
  if(f.failQuery)throw new Error('Synthetic query failure');
  if(context.signal.aborted)throw new DOMException('Aborted','AbortError');
  if(f.state.scopeKey!==context.expectedScopeKey)throw new Error('Synthetic stale scope');
  f.state.query={...query};f.state.selectedCount=0;
 },
 async applySort(sort,context){record('applySort',{sort});if(!context.signal.aborted)f.state.sort=sort;},
 async getPeople({signal}){record('getPeople',{});await wait(f.peopleDelay);if(f.failPeople)throw new Error('Synthetic people failure');if(signal.aborted)throw new DOMException('Aborted','AbortError');return f.people;},
 async chooseFolder({current}){record('chooseFolder',{current});await wait(f.folderDelay);return f.folderResult;},
 async setSelecting(on){record('setSelecting',{on});f.state.selecting=on;if(!on)f.state.selectedCount=0;},
 async selectVisible(){record('selectVisible',{});f.state.selectedCount=3;},
 async clearSelection(){record('clearSelection',{});f.state.selectedCount=0;},
 async editSelected(){record('editSelected',{});},
 async excludeSelected(){record('excludeSelected',{});},
 async restoreSelected(){record('restoreSelected',{});},
 async refresh(){record('refresh',{});f.state.refreshAvailable=false;}
};
window.ui=OurTimeHomeUI.mount({host:document.getElementById('home-host'),adapter:window.fixtureAdapter});
window.mutate=(next)=>{Object.assign(f.state,next);ui.sync();};
window.calls=(name)=>f.calls.filter(c=>c.name===name);
</script></body></html>
