name: Viewer repair resources
on:
  push:
    branches:
      - fix/viewer-display-followup-20260926
    paths:
      - .github/workflows/viewer-repair-branch.yml
      - .cloud-repair/**
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download test wheels
        run: python3 -m pip download --only-binary=:all: --no-deps pypinyin==0.55.0 pillow-heif==1.1.1 -d test-wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: viewer-test-resources
          path: |
            web/vendor/fonts
            web/assets/face-labels
            test-wheels
          retention-days: 1
