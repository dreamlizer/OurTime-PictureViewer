name: Viewer repair branch workspace
on:
  push:
    branches: [fix/viewer-display-followup-20260926]
    paths: [.github/workflows/viewer-repair-branch.yml, .cloud-repair/**]
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/fix/viewer-display-followup-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Snapshot only tracked source, never photos or databases
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('viewer-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p = pathlib.Path(name)
                  if not name or not p.is_file(): continue
                  source = (len(p.parts) == 1 and p.suffix in ('.py','.md','.txt')) or (p.parts[0] in ('web','validation','tools') and p.suffix in ('.js','.css','.html','.py','.json','.ps1'))
                  if source and not any(s in p.parts for s in ('reports','work','data','Data','node_modules','.venv')):
                      z.write(p,name)
          print('Source revision:',subprocess.check_output(['git','rev-parse','HEAD']).decode().strip())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: viewer-source
          path: viewer-source.zip
          retention-days: 1
          if-no-files-found: error
